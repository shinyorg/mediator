<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shiny Mediator</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />    
    <!-- Hosted in a shinylib.net docs page (?embed=1, see Layout/EmbedLayout.razor): mark it before the
         first paint, so the page starts the way the embed shows it. -->
    <script>
        if (/[?&]embed(=(1|true))?(&|$)/i.test(location.search))
            document.documentElement.classList.add('shiny-embed');
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Shiny.Mediator.Blazor/Mediator.js"></script>
</body>

</html>
